# Publica o jogo no GitHub Pages a cada push (site 100% estático, sem build).
name: Deploy no GitHub Pages
on:
  push:
    branches: [main, claude/kingdom-idle-strategy-game-761lu4]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monta o site
        run: |
          mkdir _site
          cp -r index.html css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aguarda o artefato ficar disponível
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
