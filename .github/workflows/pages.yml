# Publica o jogo no GitHub Pages a cada push (site 100% estático, sem build).
name: Deploy no GitHub Pages
on:
  push:
    branches: [main, claude/kingdom-idle-strategy-game-761lu4]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Monta o site
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
